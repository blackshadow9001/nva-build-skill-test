# Keeps the generated hub (index.html, README.md) in step with flows/*/flow.json,
# and checks links on every pull request. Flow branches never edit the hub, so they never conflict.
name: Prototypes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check links and screen files
        run: python3 tools/check.py .
      - name: Rebuild hub
        if: github.event_name == 'push'
        run: |
          python3 tools/build_hub.py .
          if ! git diff --quiet -- index.html README.md; then
            git config user.name "prototype-hub-bot"
            git config user.email "prototype-hub-bot@users.noreply.github.com"
            git add index.html README.md
            git commit -m "Rebuild prototype hub [skip ci]"
            git push
          fi

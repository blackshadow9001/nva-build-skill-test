<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b2d">
  <title>Meet the avatar · NVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="flow.css">
</head>
<body data-page="avatar">
  <div class="app">
    <section class="hero forest on-dark" style="height:364px">
      <div class="flute"></div>
      <div aria-hidden="true" style="position:absolute;left:50%;top:184px;width:320px;height:320px;margin:-160px;border-radius:999px;background:radial-gradient(circle,rgba(215,243,106,.28) 0%,rgba(215,243,106,0) 65%)"></div>
      <svg class="waves" data-waves data-stroke="rgba(215,243,106,.18)"></svg>
      <div class="topbar"><a href="ip03-confirm.html" aria-label="Back" class="icon-btn glass"><i data-icon="chevron-left" data-size="20"></i></a><span class="wordmark"><span data-mark="16"></span>NVA</span><span class="spacer"></span></div>
      <div style="position:relative;display:flex;justify-content:center;margin-top:16px">
        <svg aria-hidden="true" width="230" height="230" viewBox="0 0 100 100" style="position:absolute;top:50%;left:50%;margin:-115px"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1"/><circle cx="50" cy="50" r="46" fill="none" stroke="#d7f36a" stroke-width="1.2" stroke-linecap="round" class="ring" transform="rotate(-90 50 50)"/></svg>
        <span id="avatar-pop" class="pop" style="position:relative;animation-delay:.9s"><span class="float" style="display:block" data-puppy="190" data-label="Waffles' NVA avatar"></span></span>
      </div>
    </section>
    <section class="sheet">
      <div class="scroll rise">
        <div class="stack gap-10">
          <span class="eyebrow">Your pet, NVA edition</span>
          <h1 class="title-lg">Here's <span data-bind="name"></span>.</h1>
          <p class="lede">Made from her photo. You'll see her on her profile and in reminders.</p>
        </div>
        <div class="stack gap-10"><span class="label" id="collar-label">Pick her collar</span>
          <div id="swatches" class="swatches" role="radiogroup" aria-labelledby="collar-label"></div>
        </div>
        <div class="note"><i data-icon="sparkles" data-size="18"></i><span>Updates as she grows. Add a new photo any time and her avatar, weight and size estimates refresh.</span></div>
      </div>
      <div class="foot">
        <a href="ip05-easy.html" class="cta"><span>Love it</span><i data-icon="arrow-right" data-size="18"></i></a>
        <button type="button" class="ghost ghost--block" id="another-look"><i data-icon="refresh-cw" data-size="16"></i>Try another look</button>
      </div>
    </section>
  </div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b2d">
  <title>What makes care easy · NVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="flow.css">
</head>
<body data-page="easy">
  <div class="app">
    <section class="hero forest on-dark" style="padding-bottom:62px">
      <div class="flute"></div><svg class="waves" data-waves></svg>
      <div class="topbar"><a href="ip04-avatar.html" aria-label="Back" class="icon-btn glass"><i data-icon="chevron-left" data-size="20"></i></a><span class="progress" role="progressbar" aria-label="Step 1 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1"><span class="current"></span><span class=""></span><span class=""></span></span><span class="spacer"></span></div>
      
    <div class="profile glass rise">
      <div class="profile-head">
        <span class="photo thumb" role="img" aria-label="Waffles' photo"><span class="puppy-wrap" data-puppy="46"></span></span>
        <span class="stack gap-6" style="gap:2px;min-width:0"><span class="profile-name"><span data-bind="possessive"></span> profile</span><span class="profile-sub" data-bind="profile"></span></span>
      </div>
      <div class="tags"><span class="tag-glass glass">Golden puppy</span><span class="tag-glass glass" data-bind="area"></span><span class="tag-glass tag-dashed">What makes care easy</span></div>
    </div>
    </section>
    <section class="sheet">
      <div class="scroll rise">
        <div class="stack gap-10">
          <h1 class="title-lg" id="q">What makes care easy for you?</h1>
          <p class="lede">Pick any. <span data-bind="possessive"></span> plan will work around them.</p>
        </div>
        <div id="easy-opts" role="group" aria-labelledby="q" class="stack gap-10"><button type="button" class="pill">Close to home</button><button type="button" class="pill">Evening and weekend times</button><button type="button" class="pill">Book online</button><button type="button" class="pill">Video visits</button><button type="button" class="pill">Short waits</button></div>
        <div class="card" style="display:flex;align-items:center;gap:12px;padding:14px 16px">
          <span class="tile-icon tile-icon--lg tile-icon--cream"><i data-icon="calendar-sync" data-size="18"></i></span>
          <span class="stack" style="gap:2px;flex-grow:1"><span style="font-size:15px;font-weight:600" id="cal-label">Connect your calendar</span><span style="font-size:13px;line-height:18px;color:var(--muted)">We'll only suggest times you're free.</span></span>
          <button type="button" role="switch" class="toggle" id="cal-toggle" aria-labelledby="cal-label"></button>
        </div>
      </div>
      <div class="foot"><a href="ip06-costs.html" class="cta"><span>Continue</span><i data-icon="arrow-right" data-size="18"></i></a></div>
    </section>
  </div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
